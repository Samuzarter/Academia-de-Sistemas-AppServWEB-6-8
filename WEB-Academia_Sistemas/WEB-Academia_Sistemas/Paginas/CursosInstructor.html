<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CURSOS</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
</head>
<body class="hold-transition sidebar-mini">

    <!-- Menú Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Instructor</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarInstructor" aria-controls="navbarInstructor" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarInstructor">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="PaginaInstructor.html">Inicio</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="paginasInstructor" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Páginas básicas
                    </a>
                    <div class="dropdown-menu" aria-labelledby="paginasInstructor">
                        <a class="dropdown-item" href="EstudiantesPorCurso.html">Estudiantes por Curso</a>
                        <a class="dropdown-item" href="CursosInstructor.html">Cursos del Instructor</a>
                        <a class="dropdown-item" href="Equipos.html">Equipos</a>
                    </div>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="crudInstructor" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        CRUD Básico
                    </a>
                    <div class="dropdown-menu" aria-labelledby="crudInstructor">
                        <a class="dropdown-item" href="ModulosInstructor.html">Módulos del Instructor</a>
                        <a class="dropdown-item" href="CrearModulo.html">Crear Módulo</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido principal -->
    <section class="content mt-4">
        <div class="container-fluid">
            <div class="card card-primary">
                <div class="card-header">
                    <h3 class="card-title">GESTIÓN DE CURSOS</h3>
                </div>
                <form id="frmCursos">
                    <div class="card-body">
                        <div class="card card-gray-dark">
                            <div class="card-header">
                                <h3 class="card-title">DATOS DEL CURSO</h3>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="txtIdModalidad">ID MODALIDAD</label>
                                            <input type="number" class="form-control" id="txtIdModalidad" placeholder="ID de Modalidad">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="txtIdCategoria">ID CATEGORÍA</label>
                                            <input type="number" class="form-control" id="txtIdCategoria" placeholder="ID de Categoría">
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="form-group">
                                            <label for="txtNombre">NOMBRE</label>
                                            <input type="text" class="form-control" id="txtNombre" placeholder="Nombre del curso">
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label for="txtDescripcion">DESCRIPCIÓN</label>
                                            <input type="text" class="form-control" id="txtDescripcion" placeholder="Descripción del curso">
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-group">
                                            <label for="txtDuracion">DURACIÓN (horas)</label>
                                            <input type="number" class="form-control" id="txtDuracion" placeholder="Duración en horas">
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-group">
                                            <label for="txtCosto">COSTO</label>
                                            <input type="number" step="0.01" class="form-control" id="txtCosto" placeholder="Costo del curso">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card card-danger">
                            <div class="card-header">
                                <h3 class="card-title">PROCESO</h3>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-3">
                                        <br />
                                        <button type="button" class="btn btn-block btn-lg btn-primary" onclick="EjecutarComando('POST', 'Insertar')">INSERTAR</button>
                                    </div>
                                    <div class="col-md-3">
                                        <br />
                                        <button type="button" class="btn btn-block btn-lg btn-primary" onclick="EjecutarComando('PUT', 'Actualizar')">ACTUALIZAR</button>
                                    </div>
                                    <div class="col-md-3">
                                        <br />
                                        <button type="button" class="btn btn-block btn-lg btn-primary" onclick="EjecutarComando('DELETE', 'Eliminar')">ELIMINAR</button>
                                    </div>
                                    <div class="col-md-3">
                                        <br />
                                        <button type="button" class="btn btn-block btn-lg btn-primary" onclick="Consultar()">CONSULTAR</button>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <table id="tblCursos" class="table table-bordered table-striped" style="width:100%;">
                                        <thead>
                                            <tr>
                                                <th>IdCurso</th>
                                                <th>IdModalidad</th>
                                                <th>IdCategoria</th>
                                                <th>Nombre</th>
                                                <th>Descripción</th>
                                                <th>Duración</th>
                                                <th>Costo</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <div id="dvMensaje" class=""></div>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../Scripts/jquery-3.4.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <script src="Scripts/Comunes/Comunes.js"></script>
    <script src="Scripts/Comunes/CRUD.js"></script>
    <script src="Scripts/CursosInstructor.js"></script>
</body>
</html>
