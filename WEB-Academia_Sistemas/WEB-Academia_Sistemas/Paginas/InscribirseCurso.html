<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Inscripción a Curso</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row" id="dvMenu"></div>
            <div class="col-md-12">
                <div class="card card-info">
                    <div class="card-header">
                        <h3 class="card-title">Inscripción a Curso</h3>
                    </div>
                    <div class="card-body">
                        <form id="frmInscripcion">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtIdEstudiante">ID Estudiante</label>
                                        <input type="number" class="form-control" id="txtIdEstudiante" placeholder="ID del estudiante" />
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtIdCurso">ID Curso</label>
                                        <input type="number" class="form-control" id="txtIdCurso" placeholder="ID del curso" />
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtIdSede">ID Sede</label>
                                        <input type="number" class="form-control" id="txtIdSede" placeholder="ID de la sede" />
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <label>&nbsp;</label>
                                    <button type="button" class="btn btn-info btn-block" onclick="Inscribirse()">Inscribirse</button>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtFechaInicio">Fecha Inicio</label>
                                        <input type="date" class="form-control" id="txtFechaInicio" />
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtFechaFin">Fecha Fin</label>
                                        <input type="date" class="form-control" id="txtFechaFin" />
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtMonto">Monto</label>
                                        <input type="number" class="form-control" id="txtMonto" placeholder="Valor del curso (opcional)" />
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-group">
                                        <label for="txtMetodoPago">Método de Pago</label>
                                        <input type="text" class="form-control" id="txtMetodoPago" placeholder="Efectivo, tarjeta, etc." />
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div id="dvMensaje" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../Scripts/jquery-3.4.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="Scripts/Comunes/Comunes.js"></script>
    <script src="Scripts/InscribirseCurso.js"></script>
</body>
</html>
