<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cursos Inscritos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row" id="dvMenu"></div>
            <div class="col-md-12">
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">Cursos en los que está inscrito el estudiante</h3>
                    </div>
                    <div class="card-body">
                        <div class="form-group row">
                            <label for="txtIdEstudiante" class="col-sm-2 col-form-label">ID Estudiante</label>
                            <div class="col-sm-4">
                                <input type="number" class="form-control" id="txtIdEstudiante" placeholder="Ingrese ID del estudiante">
                            </div>
                            <div class="col-sm-2">
                                <button class="btn btn-success" onclick="ConsultarCursos()">Consultar</button>
                            </div>
                        </div>
                        <table id="tblCursosInscritos" class="table table-bordered table-striped">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Duración</th>
                                    <th>Fecha Inicio</th>
                                    <th>Fecha Fin</th>
                                </tr>
                            </thead>
                        </table>
                        <div id="dvMensaje" class="mt-3 text-danger"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../Scripts/jquery-3.4.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <script src="Scripts/Comunes/Comunes.js"></script>
    <script src="Scripts/Comunes/CRUD.js"></script>
    <script src="Scripts/CursosInscritos.js"></script>
</body>
</html>
