<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Registrar Pago</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row" id="dvMenu"></div>
            <div class="col-md-12">
                <div class="card card-success">
                    <div class="card-header">
                        <h3 class="card-title">Registrar Pago Estudiante</h3>
                    </div>
                    <div class="card-body">
                        <form id="frmPagoEstudiante">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="txtIdEstudiante">ID Estudiante</label>
                                        <input type="number" class="form-control" id="txtIdEstudiante" placeholder="ID del estudiante" />
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="txtValor">Valor del Pago</label>
                                        <input type="number" class="form-control" id="txtValor" placeholder="Valor a pagar" />
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-group">
                                        <label for="txtFechaPago">Fecha del Pago</label>
                                        <input type="date" class="form-control" id="txtFechaPago" />
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="txtMetodoPago">Método de Pago</label>
                                        <input type="text" class="form-control" id="txtMetodoPago" placeholder="Ej: Efectivo, Tarjeta, Transferencia" />
                                    </div>
                                </div>
                                <div class="col-md-6 d-flex align-items-end">
                                    <button type="button" class="btn btn-success btn-block" onclick="RegistrarPago()">Registrar Pago</button>
                                </div>
                            </div>
                        </form>
                        <div id="dvMensaje" class="mt-3 text-success"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../Scripts/jquery-3.4.1.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="Scripts/Comunes/Comunes.js"></script>
    <script src="Scripts/PagosEstudiante.js"></script>
</body>
</html>
